[versions]
spring-boot = "3.5.6"
spring-dependency-management = "1.1.7"
spotless = "8.10.4"
spotbugs = "6.5.13"
checkstyle = "14.3.0"
jacoco = "0.8.15"
spotbugs-tool = "4.10.5"
commons-lang3 = "3.21.0"
springdoc = "2.8.17"
testcontainers = "1.21.4"
archunit = "1.5.1"

[libraries]
springdoc-openapi-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spotbugs-tool = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs-tool" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
spring-boot-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spotbugs-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs" }
