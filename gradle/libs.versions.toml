[versions]
spring-boot = "3.5.6"
spring-dependency-management = "1.1.7"
spotless = "8.10.4"
spotbugs = "6.5.13"
checkstyle = "14.3.0"
jacoco = "0.8.15"
spotbugs-tool = "4.10.5"
commons-lang3 = "3.21.0"
springdoc = "2.8.17"

[libraries]
springdoc-openapi-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spotbugs-tool = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs-tool" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
