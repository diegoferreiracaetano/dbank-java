server:
  port: 8082

spring:
  application:
    name: dbank-payments
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: dbank
    password: dbank
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
