server:
  port: 8082

spring:
  application:
    name: dbank-payments
  datasource:
    url: jdbc:postgresql://localhost:5432/payments
    username: dbank
    password: dbank
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: dbank-payments
      auto-offset-reset: earliest
    producer:
      acks: all
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true

dbank:
  kafka:
    retry:
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 30s
      max-elapsed-time: 2m
  outbox:
    batch-size: 100
    poll-interval: 500ms
  idempotency:
    cache:
      ttl: 24h

management:
  endpoints:
    web:
      exposure:
        include: health
