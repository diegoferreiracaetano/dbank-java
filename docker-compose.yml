services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbank
      POSTGRES_PASSWORD: dbank
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbank -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
