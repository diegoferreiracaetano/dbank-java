server:
  port: 8081

spring:
  application:
    name: dbank-ledger
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger
    username: dbank
    password: dbank
  flyway:
    ignore-migration-patterns: "repeatable:missing"
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: dbank-ledger
      auto-offset-reset: earliest
    producer:
      acks: all
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    enabled: false
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health
