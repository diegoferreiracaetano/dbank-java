name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: OpenAPI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - run: npx --yes @stoplight/spectral-cli@6.15.0 lint --fail-severity=warn docs/api/*.yaml

  build:
    name: Build and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4.4.4
      - run: ./gradlew check
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  e2e:
    name: End-to-end
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4.4.4
      - run: ./gradlew e2eTest
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: e2e-reports
          path: |
            dbank-e2e/build/e2e/
            dbank-e2e/build/reports/
          retention-days: 7
